name: questflow
description: Tasks, events and continuous quests in one place.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#F0FBED"
    theme_color: "#2FA36B"
  # Android 8+ adaptive icon: solid mint backdrop, full-bleed logo layer;
  # the launcher mask crops the source's own rounded corners away.
  adaptive_icon_background: "#DEF8E9"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Familjen
      fonts:
        - asset: assets/fonts/FamiljenGrotesk-Variable.ttf
